<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수학 퀘스트 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 1차 실험실 버전 — 홈(오늘의 모험 + 3개 모드) / 내 기록 / 상점, 메뉴 3개. 한 줄 칼럼, 넓은 화면에서는 2열.
   단일 밝은 테마(학생 게임 화면)로 의도적으로 고정. */
:root{
  --sky:#cfeaf6; --sand:#fbeccc; --ink:#1c2836; --muted:#5a6878; --card:#ffffff; --line:#e2e8ef; --chip:#f1f5f9;
  --forest:#1d7a54; --forest-2:#2fae6b; --canyon:#c0362e; --canyon-2:#f06b3a; --tower:#6a3fc2; --tower-2:#9a6bf0;
  --gold:#f2b705; --gold-ink:#7a5200; --good:#1f9d55; --bad:#d64545; --blue:#2f6fdb;
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,#d9efe9 45%,var(--sand) 100%) fixed;background-color:var(--sky);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[disabled]{cursor:default}
.app{max-width:1080px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:56px;height:56px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:0 2px 0 var(--line)}
.me-name{font-family:var(--f-display);font-size:22px;line-height:1.1}
.me-sub{font-size:12px;color:var(--muted);font-weight:700}
.xpbar{position:relative;width:160px;height:16px;border-radius:8px;background:#9fb1c2;overflow:hidden;margin-top:4px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#22c58b,#5fe0a6)}
.xpbar span{position:relative;display:block;text-align:center;font-size:10px;font-weight:700;color:#fff;line-height:16px;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.pill.coin{background:#fff8dc;border:2px solid #f3d27a;color:var(--gold-ink);padding:4px 12px 4px 4px}
.pill.streak{color:#c2410c;background:#fff0e6}
.c{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe27a,var(--gold));border:2px solid #d99a00;display:grid;place-items:center;font-size:11px;color:#8a5a00}

.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tab{border:0;border-radius:14px;padding:10px 20px;font-family:var(--f-display);font-size:18px;background:rgba(255,255,255,.7);color:var(--muted);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.tab[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1d4fa8}

.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 3px 0 rgba(28,40,54,.08);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.muted{color:var(--muted);font-size:13px;margin:0;line-height:1.5}

/* 오늘의 모험 */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#fffdf4,#fff);border:2px solid #f3e0a8}
.hero .big{width:96px;height:96px}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4vw,30px);text-wrap:balance}
.rec{display:flex;gap:6px;flex-wrap:wrap}
.rec span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip)}
.start{border:0;border-radius:16px;padding:14px 22px;font-family:var(--f-display);font-size:22px;background:var(--gold);color:#3d2900;box-shadow:0 5px 0 #c99700;justify-self:start}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 #c99700}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:#e3e9ef;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--forest-2);transition:width .4s}

.rule{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#eef4ff;font-size:13px;line-height:1.55}
.rule b{color:var(--blue)}
.rule .ic{flex:none;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}

.units{display:flex;gap:6px;flex-wrap:wrap}
.unit{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.unit[aria-pressed="true"]{border-color:var(--forest);background:#e3f4eb;color:var(--forest)}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mode{display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 0 rgba(28,40,54,.1);transition:transform .15s}
.mode:not([disabled]):hover{transform:translateY(-3px)}
.mode .art{height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff}
.mode .art small{font-size:12px;font-weight:700;opacity:.9}
.mode.m1 .art{background:linear-gradient(150deg,var(--forest-2),var(--forest))}
.mode.m2 .art{background:linear-gradient(150deg,var(--canyon-2),var(--canyon))}
.mode.m3 .art{background:linear-gradient(150deg,var(--tower-2),var(--tower))}
.mode .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.mode h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.mode .meta{margin-top:auto;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mode[disabled]{opacity:.6}

.lock{align-items:center;text-align:center;border:2px dashed #b9c4d0}
.lock .ic{width:56px;height:56px;border-radius:16px;background:var(--chip);display:grid;place-items:center}

/* 기록 */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--chip);border-radius:14px;padding:12px;font-size:12px;font-weight:700;color:var(--muted)}
.tile strong{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:400}
.tile em{font-style:normal;font-size:11px;color:var(--good)}
.mast{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:84px 1fr 104px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.mrow .bar i{background:var(--tower-2)}
.mrow span:last-child{font-size:12px;color:var(--muted);text-align:right}
.chart svg{width:100%;height:auto;display:block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bd{background:var(--chip);border-radius:12px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.bd b{font-size:13px}.bd.off{opacity:.45}
.type{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#fff8dc}
.type strong{font-family:var(--f-display);font-weight:400;font-size:20px}

/* 상점 */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:16px;background:var(--chip);text-align:center}
.item b{font-size:14px}
.buy{border:0;border-radius:10px;padding:8px 12px;font-weight:900;background:var(--gold);color:#4a3200;width:100%}
.buy[disabled]{background:#dde3ea;color:#8a96a3}
.econ{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* 게임 모달 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,28,44,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.g-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-stats div{background:var(--chip);border-radius:12px;padding:8px;text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.g-stats strong{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.g-rule{font-size:12px;color:var(--blue);font-weight:700;text-align:center}
.g-q{font-family:var(--f-display);font-size:clamp(24px,6vw,34px);text-align:center;padding:20px 10px;border-radius:16px;background:linear-gradient(180deg,#f6f9fc,#eef3f8);font-variant-numeric:tabular-nums;text-wrap:balance}
.g-q small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-bottom:6px}
.read{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.read i{display:block;height:100%;width:0;background:var(--blue)}
.g-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:8px}
.opt[disabled]{opacity:.5}
.opt kbd{font:700 11px var(--f-body);color:var(--muted);background:var(--chip);border-radius:5px;padding:2px 6px}
.opt.ok{border-color:var(--good);background:#e9f7ef;opacity:1}
.opt.no{border-color:var(--bad);background:#fdeeee;opacity:1}
.g-fb{min-height:22px;text-align:center;font-weight:900;font-size:14px}
.g-fb.ok{color:var(--good)}.g-fb.no{color:var(--bad)}.g-fb.warn{color:#b45309}
.timer{height:8px;border-radius:4px;background:#f3d6d2;overflow:hidden}
.timer i{display:block;height:100%;background:var(--canyon);transition:width 1s linear}
.pause{position:absolute;inset:0;background:rgba(255,255,255,.96);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.pause strong{font-family:var(--f-display);font-weight:400;font-size:24px}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.result div{background:var(--chip);border-radius:12px;padding:12px;font-size:12px;color:var(--muted);font-weight:700}
.result strong{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-family:var(--f-display);font-size:17px;background:var(--chip)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1d4fa8}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:calc(100% - 32px)}
.toast{background:#1c2836;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;animation:tin .25s ease-out}
.toast.gold{background:#7a5200}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

.foot{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px;color:var(--muted);text-align:center}
.foot .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.foot button{border:1px solid #b9c4d0;background:rgba(255,255,255,.7);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.foot button[aria-pressed="true"]{background:#1c2836;color:#fff;border-color:#1c2836}

@media (max-width:820px){.modes{grid-template-columns:minmax(0,1fr)}.mode .art{height:72px}.grid2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.econ{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.hero{grid-template-columns:minmax(0,1fr)}.hero .big{display:none}.start{justify-self:stretch}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="me">
      <div class="ava" id="ava"></div>
      <div>
        <div class="me-name" id="nick"></div>
        <div class="me-sub" id="grade"></div>
        <div class="xpbar"><i id="xpfill"></i><span id="xptext"></span></div>
      </div>
    </div>
    <div class="stats">
      <span class="pill streak" id="streak"></span>
      <span class="pill coin"><span class="c">M</span><span id="coins"></span></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button class="tab" role="tab" data-tab="home" type="button">홈</button>
    <button class="tab" role="tab" data-tab="record" type="button">내 기록</button>
    <button class="tab" role="tab" data-tab="shop" type="button">상점</button>
  </nav>

  <section id="home" class="app" style="gap:16px"></section>
  <section id="record" class="app" style="gap:16px" hidden></section>
  <section id="shop" class="app" style="gap:16px" hidden></section>

  <div class="foot">
    <div class="row"><span>테스트 도구 (학생에게는 보이지 않음):</span>
      <button type="button" id="lockBtn" aria-pressed="false">교사: 수업 중 사용 제한</button>
      <button type="button" id="nextDay">하루 지나기</button>
      <button type="button" id="resetBtn">처음 상태로</button></div>
    <span>예시 학생·예시 데이터입니다. 진행 상황은 이 브라우저에만 저장됩니다.</span>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
const KEY='mq-proto-v2';
const UNITS=['곱셈','나눗셈','원','분수','들이와 무게'];
const DAILY_CAP=300, DAILY_GOAL=10;
const RULE='정답 1개 = 10코인 · 3문제 연속 정답마다 +5 보너스 · 하루 최대 300코인';
const DAYS=['월','화','수','목','금','토','일'];
const ITEMS=[
  {id:'cap_red',name:'빨간 모자',price:200,slot:'hat'},{id:'cap_blue',name:'파란 모자',price:200,slot:'hat'},
  {id:'crown',name:'황금 왕관',price:900,slot:'hat'},{id:'shirt_purple',name:'보라 티셔츠',price:300,slot:'shirt'},
  {id:'shirt_orange',name:'주황 티셔츠',price:300,slot:'shirt'},{id:'shirt_navy',name:'남색 후드',price:500,slot:'shirt'}
];
const SHIRT={null:'#2fae6b',shirt_purple:'#8b5cf6',shirt_orange:'#f97316',shirt_navy:'#1e3a8a'};
const BADGES=[
  {id:'first',name:'첫 모험',desc:'모험 1회 완료'},{id:'goal',name:'오늘 목표 달성',desc:'하루 10문제'},
  {id:'combo',name:'연속 정답 9',desc:'한 번에 9연속 정답'},{id:'fix5',name:'오답 해결사',desc:'틀린 문제 5개 극복'},
  {id:'streak7',name:'일주일 연속',desc:'7일 연속 학습'},{id:'master',name:'단원 마스터',desc:'숙련도 90% 단원 1개'}
];

/* ---------- 문제 (3학년 2학기 대단원) ---------- */
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function item(unit,q,ans,small,unitLabel){const d=new Set();for(const o of shuffle([1,-1,2,-2,10,-10,5,-5,3,-3,100,-100])){const v=ans+o;if(v>0&&v!==ans)d.add(v);if(d.size>=6)break}
  const u=unitLabel||'';return{unit,q,small,a:ans+u,opts:shuffle([ans,...shuffle([...d]).slice(0,3)]).map(v=>v+u)}}
const GEN={
  '곱셈'(){return Math.random()<.5?(()=>{const a=ri(12,49),b=ri(2,9);return item('곱셈',`${a} × ${b}`,a*b)})():(()=>{const a=ri(101,399),b=ri(2,4);return item('곱셈',`${a} × ${b}`,a*b)})()},
  '나눗셈'(){const b=ri(2,9),q=ri(11,30);return item('나눗셈',`${b*q} ÷ ${b}`,q)},
  '원'(){const r=ri(2,15);return Math.random()<.5?item('원',`반지름이 ${r}cm인 원`,2*r,'지름은 몇 cm일까요?','cm'):item('원',`지름이 ${2*r}cm인 원`,r,'반지름은 몇 cm일까요?','cm')},
  '분수'(){const d=ri(2,6),k=ri(2,6),m=ri(1,d-1);return item('분수',`${d*k}의 ${m}/${d}`,m*k,'얼마일까요?')},
  '들이와 무게'(){const a=ri(1,5),b=ri(1,9)*100;return Math.random()<.5?item('들이와 무게',`${a} L ${b} mL`,a*1000+b,'몇 mL일까요?','mL'):item('들이와 무게',`${a} kg ${b} g`,a*1000+b,'몇 g일까요?','g')}
};
function speedQ(){if(Math.random()<.6){const a=ri(2,9),b=ri(2,9);return item('곱셈',`${a} × ${b}`,a*b)}const a=ri(11,59),b=ri(11,39);return item('덧셈',`${a} + ${b}`,a+b)}

function defaults(){
  const wrongs=[GEN['분수'](),GEN['들이와 무게'](),GEN['나눗셈'](),GEN['분수']()];
  return{nick:'소원',grade:'3학년 2학기',level:12,xp:340,coins:820,todayCoins:0,todaySolved:0,streak:5,
    mastery:{'곱셈':72,'나눗셈':48,'원':88,'분수':35,'들이와 무게':22},
    pick:null,wrongs,overcome:3,
    week:[{s:14,c:11},{s:0,c:0},{s:18,c:13},{s:9,c:8},{s:16,c:12},{s:0,c:0},{s:0,c:0}],today:4,
    lastWeekSolved:41,best:{speed:180},owned:{},hat:null,shirt:null,badges:{first:true},
    totalSolved:57,totalCorrect:44,fastFlags:0,locked:false,tab:'home'};
}
let S;try{const r=localStorage.getItem(KEY);S=r?Object.assign(defaults(),JSON.parse(r)):defaults()}catch(e){S=defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('ko-KR');

/* ---------- 추천 ---------- */
function weakest(){return UNITS.slice().sort((a,b)=>S.mastery[a]-S.mastery[b])[0]}
function recommend(){
  if(S.wrongs.length>=3)return{mode:'retry',title:'틀린 문제 다시 풀기',why:`틀린 문제가 ${S.wrongs.length}개 모였어요`,n:Math.min(S.wrongs.length,8)};
  const u=S.pick||weakest();return{mode:'step',unit:u,title:`차근차근 풀기 · ${u}`,why:S.pick?'내가 고른 단원':`숙련도가 가장 낮은 단원 (${S.mastery[u]}%)`,n:8};
}

function weekChart(){
  const W=520,H=170,pad={l:30,r:10,t:16,b:26},max=Math.max(20,...S.week.map(d=>d.s));
  const bw=(W-pad.l-pad.r)/7,sc=v=>H-pad.b-(v/max)*(H-pad.t-pad.b);
  let g='';for(const v of [0,10,20].filter(v=>v<=max)){g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${sc(v)}" y2="${sc(v)}" stroke="#e2e8ef"/><text x="${pad.l-6}" y="${sc(v)+4}" text-anchor="end" font-size="11" fill="#5a6878">${v}</text>`}
  S.week.forEach((d,i)=>{const x=pad.l+i*bw+bw*.2,w=bw*.6,y=sc(d.s),today=i===S.today;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${H-pad.b-y}" rx="4" fill="${today?'#f2b705':'#2fae6b'}"/>`;
    if(d.s)g+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2836">${d.s}</text>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="${today?'#7a5200':'#5a6878'}" font-weight="${today?700:400}">${DAYS[i]}${today?'(오늘)':''}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="요일별 푼 문제 수">${g}</svg>`;
}

/* ---------- 배지 ---------- */
function checkBadges(){const c={first:true,goal:S.todaySolved>=DAILY_GOAL,combo:(S.bestCombo||0)>=9,fix5:S.overcome>=5,streak7:S.streak>=7,master:UNITS.some(u=>S.mastery[u]>=90)};
  BADGES.forEach(b=>{if(c[b.id]&&!S.badges[b.id]){S.badges[b.id]=true;toast('배지 획득: '+b.name,true)}})}

/* ---------- 게임 ---------- */
let G=null,timer=null,readT=null;
const MODE={step:{name:'차근차근 풀기',sub:'성장의 숲',minMs:1500,fastMs:2500},speed:{name:'시간 도전',sub:'불꽃의 협곡',minMs:600,fastMs:900},retry:{name:'틀린 문제 다시 풀기',sub:'지혜의 탑',minMs:1500,fastMs:2500}};
function start(mode,unit){
  if(S.locked){toast('지금은 수업 시간이라 잠겨 있어요');return}
  G={mode,unit:unit||S.pick||weakest(),i:0,total:mode==='speed'?Infinity:mode==='retry'?Math.min(S.wrongs.length,8):8,correct:0,combo:0,maxCombo:0,coins:0,xp:0,score:0,time:40,recent:[],flagged:0,fixed:0,newWrong:0,over:false,lock:true};
  if(mode==='retry')G.queue=S.wrongs.slice(0,G.total);
  if(mode==='speed')timer=setInterval(()=>{G.time--;const t=$('#tl');if(t)t.textContent=G.time;const b=$('#tb');if(b)b.style.width=G.time/40*100+'%';if(G.time<=0)end()},1000);
  next();
}
function next(){if(G.i>=G.total){end();return}G.cur=G.mode==='speed'?speedQ():G.mode==='retry'?G.queue[G.i]:GEN[G.unit]();G.cur.opts=shuffle(G.cur.opts.slice());draw()}
function draw(){
  const m=MODE[G.mode],c=G.cur;
  const head=G.mode==='speed'?`<div class="g-stats"><div>남은 시간<strong id="tl">${G.time}</strong></div><div>점수<strong>${G.score}</strong></div><div>연속 정답<strong>${G.combo}</strong></div></div><div class="timer"><i id="tb" style="width:${G.time/40*100}%"></i></div>`
    :`<div class="g-stats"><div>문제<strong>${G.i+1}/${G.total}</strong></div><div>정답<strong>${G.correct}</strong></div><div>연속 정답<strong>${G.combo}</strong></div></div>`;
  $('#sheet').innerHTML=`<h2><span>${m.name} <small>${m.sub}${G.mode==='step'?' · '+G.unit:G.mode==='retry'?' · '+c.unit:''}</small></span><button class="x" type="button" aria-label="그만하기">×</button></h2>${head}
    <div class="g-rule">${G.mode==='speed'?'정답 1개 = 10점 · 코인 10 · 3연속마다 +5':RULE}</div>
    <div class="g-q">${c.small?`<small>${c.small}</small>`:''}${c.q}</div>
    <div class="read" aria-hidden="true"><i id="rd"></i></div>
    <div class="g-opts">${c.opts.map((o,i)=>`<button class="opt" data-o="${i}" type="button" disabled><kbd>${i+1}</kbd>${o}</button>`).join('')}</div>
    <div class="g-fb" id="fb">문제를 읽어 보세요</div>`;
  $('#overlay').hidden=false;
  // 최소 풀이 시간: 보기는 잠깐 뒤에 열림
  const rd=$('#rd');requestAnimationFrame(()=>{rd.style.transition=`width ${m.minMs}ms linear`;rd.style.width='100%'});
  G.lock=true;clearTimeout(readT);readT=setTimeout(()=>{if(!G)return;G.lock=false;G.t0=performance.now();document.querySelectorAll('.opt').forEach(b=>b.disabled=false);const f=$('#fb');if(f)f.textContent=''},m.minMs);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.o,b));
}
function answer(i,btn){
  if(!G||G.lock||G.over)return;G.lock=true;
  const m=MODE[G.mode],ok=G.cur.opts[i]===G.cur.a,dt=performance.now()-G.t0,fast=dt<m.fastMs;
  G.recent.push({fast,ok});if(G.recent.length>3)G.recent.shift();
  const guess=G.recent.length===3&&G.recent.every(r=>r.fast)&&G.recent.filter(r=>!r.ok).length>=2;
  S.todaySolved++;S.totalSolved++;S.week[S.today].s++;
  let msg='',cls='ok';
  if(ok){
    G.correct++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);S.bestCombo=Math.max(S.bestCombo||0,G.combo);S.totalCorrect++;S.week[S.today].c++;
    let coin=10+(G.combo%3===0?5:0);
    if(fast&&G.mode!=='speed'){coin=0;G.flagged++;msg='정답! 다만 너무 빨라서 코인은 없어요'}
    const room=Math.max(0,DAILY_CAP-S.todayCoins);coin=Math.min(coin,room);
    S.coins+=coin;S.todayCoins+=coin;G.coins+=coin;
    S.xp+=10;G.xp+=10;while(S.xp>=1000){S.xp-=1000;S.level++;toast('레벨 업! Lv.'+S.level,true)}
    if(G.mode==='speed')G.score+=10;
    if(G.mode!=='speed'){const u=G.cur.unit;if(S.mastery[u]!=null)S.mastery[u]=Math.min(100,S.mastery[u]+3)}
    if(G.mode==='retry'){const k=S.wrongs.indexOf(G.cur);if(k>=0)S.wrongs.splice(k,1);S.overcome++;G.fixed++}
    if(!msg)msg=`정답! +${coin} 코인${G.combo%3===0?' (3연속 보너스)':''}${room===0?' · 오늘 코인 상한 도달':''}`;
    btn.classList.add('ok');
  }else{
    G.combo=0;cls='no';
    if(G.mode!=='speed'){const u=G.cur.unit;if(S.mastery[u]!=null)S.mastery[u]=Math.max(0,S.mastery[u]-1)}
    if(G.mode!=='retry'&&!fast&&S.wrongs.length<30){S.wrongs.push(G.cur);G.newWrong++}
    msg=G.mode==='retry'?'다음에 한 번 더 나와요':G.mode==='speed'?'아쉬워요! 연속 정답이 끊겼어요':'틀린 문제 모음에 자동으로 담았어요';
    btn.classList.add('no');document.querySelectorAll('.opt').forEach(b=>{if(G.cur.opts[+b.dataset.o]===G.cur.a)b.classList.add('ok')});
  }
  const fb=$('#fb');fb.className='g-fb '+cls;fb.textContent=msg;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  G.i++;
  if(guess){G.flagged++;G.recent=[];setTimeout(()=>{if(!G||G.over)return;
    const p=document.createElement('div');p.className='pause';p.innerHTML='<strong>천천히 다시 읽어 볼까요?</strong><p class="muted">빠르게 고른 답이 연달아 틀렸어요.<br>문제를 끝까지 읽고 풀면 코인을 받을 수 있어요.</p><div class="read" style="width:60%"><i id="pz"></i></div>';
    $('#sheet').appendChild(p);requestAnimationFrame(()=>{const z=$('#pz');z.style.transition='width 4s linear';z.style.width='100%'});
    setTimeout(()=>{if(G&&!G.over)next()},4000)},700);return}
  setTimeout(()=>{if(G&&!G.over)next()},ok?600:1200);
}
function stop(){clearInterval(timer);timer=null;clearTimeout(readT);G=null}
function end(){
  if(!G||G.over)return;G.over=true;clearInterval(timer);timer=null;clearTimeout(readT);
  const g=G;let note='';
  if(g.mode==='speed'&&g.score>S.best.speed){S.best.speed=g.score;note='<p class="muted">내 최고 기록을 새로 세웠어요!</p>'}
  if(g.newWrong)note+=`<p class="muted">틀린 ${g.newWrong}문제는 '틀린 문제 다시 풀기'에 자동으로 담겼어요.</p>`;
  if(g.fixed)note+=`<p class="muted">틀렸던 문제 ${g.fixed}개를 극복했어요.</p>`;
  if(g.flagged)note+=`<p class="muted">너무 빨리 고른 ${g.flagged}문제는 코인에서 제외됐어요.</p>`;
  G=null;render();
  $('#sheet').innerHTML=`<h2>${MODE[g.mode].name} 결과<button class="x" type="button" aria-label="닫기">×</button></h2>
    <div class="result"><div>${g.mode==='speed'?'점수':'정답'}<strong>${g.mode==='speed'?g.score+'점':g.correct+'/'+g.i}</strong></div><div>최대 연속 정답<strong>${g.maxCombo}</strong></div><div>받은 코인<strong>+${g.coins}</strong></div><div>오늘 목표<strong>${Math.min(S.todaySolved,DAILY_GOAL)}/${DAILY_GOAL}</strong></div></div>
    ${note}<div class="btns"><button class="btn" id="gHome" type="button">홈으로</button><button class="btn primary" id="gAgain" type="button">한 번 더</button></div>`;
  $('#overlay').hidden=false;
  $('#gHome').onclick=close;$('#gAgain').onclick=()=>{if(g.mode==='retry'&&!S.wrongs.length){close();return}start(g.mode,g.unit)};
}
function close(){$('#overlay').hidden=true;stop();render()}

/* ---------- 이벤트 ---------- */
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'||e.target.closest('.x'))close()});
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')close();if(G&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){S.tab=t.dataset.tab;render();return}
  if(e.target.closest('#startRec')){const r=recommend();start(r.mode,r.unit);return}
  const u=e.target.closest('[data-u]');if(u){S.pick=u.dataset.u||null;render();return}
  const m=e.target.closest('.mode');if(m&&!m.disabled){start(m.dataset.mode);return}
  const b=e.target.closest('[data-buy]');if(b){const it=ITEMS.find(x=>x.id===b.dataset.buy);
    if(!S.owned[it.id]){if(S.coins<it.price)return;S.coins-=it.price;S.owned[it.id]=true;toast(it.name+' 구매 완료')}
    S[it.slot]=it.id;render();return}
});
$('#lockBtn').onclick=()=>{S.locked=!S.locked;if(S.locked&&G)close();toast(S.locked?'교사 설정: 수업 중 사용 제한 켬':'교사 설정: 사용 허용');render()};
$('#nextDay').onclick=()=>{if(S.todaySolved>0)S.streak++;else S.streak=0;S.todaySolved=0;S.todayCoins=0;
  S.today=(S.today+1)%7;if(S.today===0){S.lastWeekSolved=S.week.reduce((a,d)=>a+d.s,0);S.week=S.week.map(()=>({s:0,c:0}))}S.week[S.today]={s:0,c:0};toast('다음 날이 되었어요 (테스트)');render()};
let armed=false;
$('#resetBtn').onclick=e=>{if(!armed){armed=true;e.target.textContent='한 번 더 누르면 초기화';setTimeout(()=>{armed=false;e.target.textContent='처음 상태로'},3000);return}S=defaults();armed=false;e.target.textContent='처음 상태로';render()};
render();
})();
</script>
</body>
</html>
